# ============================================================
# DNF 拍卖行同步配置 V4.0 (Docker 容器版)
#
# 注意: 本文件中的 GAME_PASSWORD / SERVER_GROUP_DB 为占位符,
#       容器首次启动时会自动替换为实际值。
#       之后用户可自行修改本文件调整经济参数,
#       修改后重启容器生效(SIGHUP 可重载价格表)。
# ============================================================

mysql:
  # 容器内通过 mysql proxy(3306) 访问大区数据库, 无需修改
  host: 127.0.0.1
  port: 3306
  user: game
  password: "GAME_PASSWORD"
  # 以下数据库名中的 SERVER_GROUP_DB 会被替换为大区数据库前缀(默认 cain)
  auction_db: taiwan_SERVER_GROUP_DB_auction_gold
  frida_db: frida
  mail_db: taiwan_SERVER_GROUP_DB_2nd

auction:
  # 容器内 df_auction_r 由 supervisor 管理, 通过 supervisorctl 重启
  stop_cmd: "supervisorctl -c /etc/supervisord.conf stop dnf:auction"
  start_cmd: "supervisorctl -c /etc/supervisord.conf start dnf:auction"
  work_dir: /data/auction

interval: 3600

# ============================================================
# V4.0 经济参数(集中可调)
# ============================================================
economy:
  # 数据源(相对 executable/脚本同目录)
  # 未提供价格表时使用二进制内嵌的默认价格表
  price_table_csv: ./装备和道具价格表_v2.csv

  # 业务魔数
  max_unit_price: 2999999999 # 单价上限,超过则放弃
  min_price_ratio: 0.10 # 实际上架价不低于 P_std * 0.10
  deposit: 10000 # 拍卖行押金
  fee_rate: 0.05 # 拍卖行手续费率(5%,即 0.05)
  consume_target_value: 100000000 # 4.1 消耗品目标总价值(1 亿,默认)
  consume_max_stack: 1000 # 消耗品单次上架最大堆叠数,防止 add_info 溢出

  # 是否真往 auction_main 写数据(默认 false,只输出计划)
  # DNF 的 df_auction_r 对字段格式有严格要求,字段值不对会出问题。
  # 调试时可改成 false。
  insert_to_auction: true

  # 装备目标件数(每个 item_id 维度)
  equip_target_count:
    white: { min: 1, max: 5 }
    blue: { min: 1, max: 5 }
    purple: { min: 1, max: 3 }
    pink: { min: 1, max: 2 }

  # 3.1 卖家心态
  seller_mind:
    - { name: 急需, prob: 0.20, mult_min: 0.50, mult_max: 0.80 }
    - { name: 普通, prob: 0.60, mult_min: 0.90, mult_max: 1.10 }
    - { name: 奸商, prob: 0.15, mult_min: 1.10, mult_max: 1.30 }
    - { name: 小白, prob: 0.05, mult_min: 1.30, mult_max: 1.50 }

  # 3.2 饱和度
  saturation:
    scarce_threshold: 5
    saturated_threshold: 20
    scarce_shift: 0.10
    saturated_shift: -0.10
    min_floor: 0.10

  # 5.3 强化等级分布(按稀有度,各档概率和 = 1.0)
  enhance_dist:
    white:
      [
        { lvl: 12, p: 0.638 },
        { lvl: 13, p: 0.197 },
        { lvl: 14, p: 0.098 },
        { lvl: 15, p: 0.050 },
        { lvl: 16, p: 0.010 },
